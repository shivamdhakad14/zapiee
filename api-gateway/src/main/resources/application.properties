spring.application.name=api-gateway
server.port=3333
server.address=0.0.0.0
spring.profiles.active=prod

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

frontend.url=${FRONTEND_URL:http://localhost:5173}

# REDIS (rate limiter)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=1

# EUREKA
eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# GATEWAY HTTP CLIENT TIMEOUTS
spring.cloud.gateway.httpclient.connect-timeout=3000
spring.cloud.gateway.httpclient.response-timeout=5s
spring.cloud.gateway.httpclient.pool.max-idle-time=15s

spring.cloud.gateway.default-filters[0].name=RequestRateLimiter
spring.cloud.gateway.default-filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.default-filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.default-filters[0].args.redis-rate-limiter.requestedTokens=1
spring.cloud.gateway.default-filters[0].args.key-resolver=#{@ipKeyResolver}

# RESILIENCE4J
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.slowCallRateThreshold=50
resilience4j.circuitbreaker.configs.default.slowCallDurationThreshold=2s
resilience4j.circuitbreaker.configs.default.recordExceptions[0]=java.io.IOException
resilience4j.circuitbreaker.configs.default.recordExceptions[1]=java.util.concurrent.TimeoutException

resilience4j.circuitbreaker.instances.restaurantServiceFallback.baseConfig=default
resilience4j.circuitbreaker.instances.menuServiceFallback.baseConfig=default
resilience4j.circuitbreaker.instances.orderServiceFallback.baseConfig=default
resilience4j.circuitbreaker.instances.paymentServiceFallback.baseConfig=default
resilience4j.circuitbreaker.instances.staffServiceFallback.baseConfig=default
resilience4j.circuitbreaker.instances.notificationServiceFallback.baseConfig=default

# Applies to all timelimiter instances unless overridden - present in every
# profile now (previously prod had none at all).
resilience4j.timelimiter.configs.default.timeoutDuration=4s

# MANAGEMENT / MONITORING
management.endpoints.web.exposure.include=health,info,metrics,prometheus,gateway
management.endpoint.health.show-details=when-authorized
management.endpoint.gateway.access=read-only
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

# LOGGING
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.security=INFO
logging.level.reactor.netty=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId}] %-5level %logger{36} - %msg%n
logging.file.name=logs/api-gateway.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

spring.cloud.config.enabled=false