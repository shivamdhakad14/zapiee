spring:
  cloud:
    gateway:
      routes:
        - id: auth-secure-api
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/users/**
            - Method=GET,POST,PUT,PATCH,DELETE
          filters:
            - name: RoleBasedAccess
              args:
                requiredRoles: ROLE_ADMIN
                anyRole: true
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        - id: auth-api
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**

        - id: restaurant-api
          uri: lb://RESTAURANT-SERVICE
          predicates:
            - Path=/api/restaurants/**,/api/tables/**,/api/v1/restaurants/**
          filters:
            - name: CircuitBreaker
              args:
                name: restaurantServiceFallback
                fallbackUri: forward:/fallback/restaurant
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        - id: menu-public-api
          uri: lb://MENU-SERVICE
          predicates:
            - Path=/api/category/**,/api/customer/menu/**
          filters:
            - name: CircuitBreaker
              args:
                name: menuServiceFallback
                fallbackUri: forward:/fallback/menu

        - id: menu-secure-api
          uri: lb://MENU-SERVICE
          predicates:
            - Path=/api/menu/**,/api/images/**
          filters:
            - name: RoleBasedAccess
              args:
                requiredRoles: ROLE_OWNER,ROLE_STAFF
                anyRole: true
            - name: CircuitBreaker
              args:
                name: menuServiceFallback
                fallbackUri: forward:/fallback/menu

        - id: order-api
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**,/ws/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderServiceFallback
                fallbackUri: forward:/fallback/order

        - id: payment-api
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**,/api/subscriptions/**,/api/v1/plans/**,/api/v1/webHooks/**,/api/v1/subscriptions/**,/api/v1/order-payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentServiceFallback
                fallbackUri: forward:/fallback/payment
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        - id: staff-api
          uri: lb://STAFF-SERVICE
          predicates:
            - Path=/api/staffs/**
          filters:
            - name: CircuitBreaker
              args:
                name: staffServiceFallback
                fallbackUri: forward:/fallback/staff

        - id: notification-api
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: CircuitBreaker
              args:
                name: notificationServiceFallback
                fallbackUri: forward:/fallback/notification