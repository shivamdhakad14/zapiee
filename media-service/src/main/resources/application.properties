spring.application.name=media-service

server.port=8081

ureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

spring.datasource.url=jdbc:mysql://localhost:3307/media_db
spring.datasource.username=apple
spring.datasource.password=12345678
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MEDIA_MAX_FILE_SIZE:8MB}
spring.servlet.multipart.max-request-size=${MEDIA_MAX_REQUEST_SIZE:10MB}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dysmiwuy}
cloudinary.api-key=${CLOUDINARY_API_KEY:473929124682825}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:zu_TZGbzs2hOE_OGyJV2qyGA5gY}
cloudinary.secure=true
cloudinary.folder-prefix=${CLOUDINARY_FOLDER_PREFIX:zapiee}
cloudinary.upload-timeout-ms=${CLOUDINARY_TIMEOUT_MS:15000}

# Media Configuration
media.allowed-content-types=image/jpeg,image/png,image/webp
media.max-file-size-bytes=8388608
media.max-image-dimension=4096

# Menu Image Transformation
media.menu-image.transformation-width=1200
media.menu-image.transformation-height=1200
media.menu-image.crop=limit
media.menu-image.quality=auto
media.menu-image.fetch-format=auto

# Logo Transformation
media.logo.transformation-width=512
media.logo.transformation-height=512
media.logo.crop=fit

media.idempotency-ttl-hours=48

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true

# Resilience4j - Circuit Breaker
resilience4j.circuitbreaker.instances.cloudinary.sliding-window-size=20
resilience4j.circuitbreaker.instances.cloudinary.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cloudinary.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.cloudinary.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.cloudinary.register-health-indicator=true

# Resilience4j - Retry
#resilience4j.retry.instances.cloudinary.max-attempts=3
#resilience4j.retry.instances.cloudinary.wait-duration=300ms
#resilience4j.retry.instances.cloudinary.retry-exceptions[0]=java.io.IOException
#resilience4j.retry.instances.cloudinary.retry-exceptions[1]=com.zapiee.media.exception.StorageProviderException

# Resilience4j - TimeLimiter
resilience4j.timelimiter.instances.cloudinary.timeout-duration=15s

# SpringDoc / Swagger
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs

# Logging
logging.level.com.zapiee.media=INFO