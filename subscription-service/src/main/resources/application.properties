spring.application.name=subscription-service

server.port=8086

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

spring.datasource.url=jdbc:mysql://localhost:3307/subscription_db
spring,datasource.username=apple
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000ms

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# Razorpay Configuration
razorpay.key-id=rzp_test_TcnRgd5AX8G2Eu
razorpay.key-secret=MsiuyphQdwWz2xkIPvJlC6aS
razorpay.webhook-secret=shivamnarayanharikrishna

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.razorpay.sliding-window-size=10
resilience4j.circuitbreaker.instances.razorpay.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.razorpay.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.razorpay.permitted-number-of-calls-in-half-open-state=3

# Resilience4j Retry
resilience4j.retry.instances.razorpay.max-attempts=3
resilience4j.retry.instances.razorpay.wait-duration=10s
resilience4j.retry.instances.razorpay.exponential-backoff-multiplier=2

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.restaurant.payment=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

razorpay.merchant-secret=
# SWAGGER
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html