spring.application.name=auth-service

spring.datasource.url=jdbc:mysql://localhost:3307/auth_db
spring,datasource.username=apple
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

# Security Configuration
security.password.min-length=8
security.password.require-uppercase=true
security.password.require-lowercase=true
security.password.require-digit=true
security.password.require-special-char=true

security.account-lockout.max-attempts=5
security.account-lockout.lockout-duration-minutes=30
security.password-reset.token-expiration-minutes=30
security.email-verification.token-expiration-hours=24
security.session.max-concurrent-sessions=3

# Rate Limiting
rate-limit.login.max-attempts=5
rate-limit.login.duration-seconds=300
rate-limit.registration.max-attempts=3
rate-limit.registration.duration-seconds=3600

# Rate Limiting for OTP
rate-limit.email-verification.max-attempts=5
rate-limit.email-verification.duration-seconds=3600

# OTP Configuration
otp.length=6
otp.expiration-minutes=10
otp.max-attempts=3

