spring.application.name=staff-service

server.port=${SERVER_PORT}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# JWT CONFIGURATION
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
jwt.issuer=OderZap-staff-service


## ===============================
## SECURITY CONFIGURATION
## ===============================
security.password.min-length=8
security.password.require-uppercase=true
security.password.require-lowercase=true
security.password.require-digit=true
security.password.require-special-char=true

security.account-lockout.max-attempts=5
security.account-lockout.lockout-duration-minutes=30
security.password-reset.token-expiration-minutes=30
security.email-verification.token-expiration-hours=24
security.session.max-concurrent-sessions=3


# ===============================
# EUREKA
# ===============================
# EUREKA
#eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}
#eureka.client.fetch-registry=true
#eureka.client.register-with-eureka=true
#eureka.instance.prefer-ip-address=true
#eureka.instance.lease-renewal-interval-in-seconds=10
#eureka.instance.lease-expiration-duration-in-seconds=30
#eureka.client.healthcheck.enabled= true
#logging.level.com.netflix.discovery= DEBUG

# KAFKA PRODUCER
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true

# KAFKA TOPIC
notification.topics=notification-topic

# Redis
#spring.data.redis.host=${REDIS_HOST}
#spring.data.redis.port=${REDIS_PORT}
#spring.data.redis.password=${REDIS_PASSWORD:}
#spring.data.redis.timeout=2000ms
#spring.data.redis.lettuce.pool.max-active=8
#spring.data.redis.lettuce.pool.max-idle=8
#spring.data.redis.lettuce.pool.min-idle=2

# Rate Limiting
rate-limit.login.max-attempts=5
rate-limit.login.duration-seconds=300

rate-limit.registration.max-attempts=3
rate-limit.registration.duration-seconds=3600

# Management & Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# Logging
logging.level.root=INFO
logging.level.com.example.auth=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

logging.file.name=logs/auth-service.log
logging.file.max-size=10MB
logging.file.max-history=30

