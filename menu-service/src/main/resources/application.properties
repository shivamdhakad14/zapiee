spring.application.name=menu-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3307/menu_db
spring,datasource.username=apple
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

gemini.api-key={$GCP}
gemini.model=gemini-3.8-flash
gemini.base-url=https://generativelanguage.googleapis.com/v1beta

resilience4j.ratelimiter.instances.geminiExtraction.limit-for-period=5
resilience4j.ratelimiter.instances.geminiExtraction.limit-refresh-period=60s
resilience4j.ratelimiter.instances.geminiExtraction.timeout-duration=30s

resilience4j.retry.instances.geminiExtraction.max-attempts=10
resilience4j.retry.instances.geminiExtraction.wait-duration=5s
resilience4j.retry.instances.geminiExtraction.enable-exponential-backoff=true
resilience4j.retry.instances.geminiExtraction.exponential-backoff-multiplier=2
resilience4j.retry.instances.geminiExtraction.max-wait-duration=60s

resilience4j.retry.instances.geminiExtraction.retry-exceptions[0]=org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.geminiExtraction.retry-exceptions[1]=org.springframework.web.client.ResourceAccessException

resilience4j.retry.instances.geminiExtraction.ignore-exceptions[0]=com.zapiee.menu_service.exception.MenuExtractionSafetyBlockedException
resilience4j.retry.instances.geminiExtraction.ignore-exceptions[1]=com.zapiee.menu_service.exception.MenuExtractionException

resilience4j.bulkhead.instances.geminiExtraction.max-concurrent-calls=1
resilience4j.bulkhead.instances.geminiExtraction.max-wait-duration=60s

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB