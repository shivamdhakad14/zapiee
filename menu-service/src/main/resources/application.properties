spring.application.name=menu-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3307/menu_db
spring,datasource.username=apple
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

gemini.api-key={$GCP}
gemini.model=gemini-3.8-flash
gemini.base-url=https://generativelanguage.googleapis.com/v1beta

resilience4j.ratelimiter.instances.geminiExtraction.limit-for-period=5
resilience4j.ratelimiter.instances.geminiExtraction.limit-refresh-period=60s
resilience4j.ratelimiter.instances.geminiExtraction.timeout-duration=30s

resilience4j.retry.instances.geminiExtraction.max-attempts=10
resilience4j.retry.instances.geminiExtraction.wait-duration=5s
resilience4j.retry.instances.geminiExtraction.enable-exponential-backoff=true
resilience4j.retry.instances.geminiExtraction.exponential-backoff-multiplier=2
resilience4j.retry.instances.geminiExtraction.max-wait-duration=60s

resilience4j.retry.instances.geminiExtraction.retry-exceptions[0]=org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.geminiExtraction.retry-exceptions[1]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.geminiExtraction.ignore-exceptions[0]=com.zapiee.menu_service.exception.MenuExtractionSafetyBlockedException
resilience4j.retry.instances.geminiExtraction.ignore-exceptions[1]=com.zapiee.menu_service.exception.MenuExtractionException

resilience4j.bulkhead.instances.geminiExtraction.max-concurrent-calls=1
resilience4j.bulkhead.instances.geminiExtraction.max-wait-duration=60s

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Image Provider Configuration
images.connect-timeout=1s
images.read-timeout=3s
images.aggregate-timeout=7s

# Pexels API
images.pexels.base-url=https://api.pexels.com/v1
images.pexels.api-key=${PEXELS_API_KEY:x4dBCttuzVBLrmpZK1fqcxTE4dsWCIsriGu57jKIN6o}

# Unsplash API
images.unsplash.base-url=https://api.unsplash.com
images.unsplash.api-key=${UNSPLASH_ACCESS_KEY:x4dBCttuzVBLrmpZK1fqcxTE4dsWCIsriGu57jKIN6o"}

# Caffeine Cache
spring.cache.type=caffeine
spring.cache.cache-names=imageSearch
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=6h


# Resilience4j Retry Configuration
resilience4j.retry.instances.images.max-attempts=5
resilience4j.retry.instances.images.wait-duration=2000ms
resilience4j.retry.instances.images.retry-exceptions[0]=com.zapiee.menu_service.exception.TransientImageProviderException

# Resilience4j Circuit Breaker Default Configuration
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.record-exceptions[0]=com.zapiee.menu_service.exception.ImageProviderException


# Pexels Circuit Breaker
resilience4j.circuitbreaker.instances.pexels.base-config=default

# Unsplash Circuit Breaker
resilience4j.circuitbreaker.instances.unsplash.base-config=default