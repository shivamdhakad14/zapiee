spring.application.name=table-service

server.port=8083
server.address=0.0.0.0

spring.datasource.url=jdbc:mysql://localhost:3307/table_db
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# EUREKA
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

customer.ui.base-url=http://10.143.102.154:5173/menu

# Customer location validation
zapiee.location.allowed-radius-meters=30
zapiee.location.max-gps-accuracy-meters=100

# SWAGGER
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
