spring.application.name=table-service

server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3307/table_db
spring.datasource.username=apple
spring.datasource.password=12345678

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# EUREKA
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

customer.ui.base-url=http://localhost:5173/menu

# Customer location validation
zapiee.location.allowed-radius-meters=200
zapiee.location.max-gps-accuracy-meters=100

# SWAGGER
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
